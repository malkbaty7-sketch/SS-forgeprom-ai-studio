name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Unit tests (domain layer)
        shell: bash
        run: |
          if ! gradle testDebugUnitTest --console=plain --stacktrace 2>&1 | tee android-test.log; then
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < <(grep -E '^e: |^> Task .*FAILED|^.* > .* FAILED|^Execution failed|^Caused by:' android-test.log | head -12)
            for f in app/build/test-results/testDebugUnitTest/TEST-*.xml; do
              grep -o '<failure[^>]*' "$f" | head -4 | cut -c1-600 | while IFS= read -r detail; do printf '::error::%s\n' "$detail"; done
            done
            exit 1
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: forgeprom-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK (R8 + shrink)
        shell: bash
        run: |
          if ! gradle assembleRelease --console=plain --stacktrace 2>&1 | tee android-release.log; then
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < <(grep -E '^e: |^> Task .*FAILED|^Execution failed|^Caused by:|R8|Missing class' android-release.log | head -20)
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: forgeprom-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
