name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests (domain layer)
        shell: bash
        run: |
          if ! ./gradlew testDebugUnitTest --console=plain --stacktrace 2>&1 | tee android-test.log; then
            { find app/build/test-results -name '*.xml' -print0 2>/dev/null | xargs -0 -r grep -h -o '<failure[^>]*' 2>/dev/null || true; } | head -6 | cut -c1-900 | while IFS= read -r detail; do printf '::error::%s\n' "$detail"; done
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < <(grep -E '^e: |^> Task .*FAILED|^.* > .* FAILED|^Execution failed|^Caused by:' android-test.log | head -5 || true)
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: forgeprom-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK (R8 + shrink)
        shell: bash
        run: |
          if ! ./gradlew assembleRelease --console=plain --stacktrace 2>&1 | tee android-release.log; then
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < <(grep -E '^e: |^> Task .*FAILED|^Execution failed|^Caused by:|R8|Missing class' android-release.log | head -20)
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: forgeprom-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
