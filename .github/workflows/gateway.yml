name: Gateway CI

on:
  push:
    branches: [ main ]
    paths:
      - 'services/ai-gateway/**'
      - '.github/workflows/gateway.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/ai-gateway/**'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/ai-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit and HTTP tests
        run: npm test

      - name: Build container image
        run: docker build -t forgeprom-gateway:ci .
