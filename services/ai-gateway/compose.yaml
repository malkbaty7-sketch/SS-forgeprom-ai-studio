services:
  gateway:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    # يُنشر على المضيف المحلي فقط؛ ضع وكيلاً عكسياً يُنهي TLS أمامه.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # يمنح الإغلاق اللطيف مهلة إضافية قبل SIGKILL.
    stop_grace_period: 15s
